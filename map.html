<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map — Istanbul Cinema Tourism</title>

  <!-- ─── STANDARD METADATA ──────────────────────────────────────────────── -->
  <meta name="description" content="Interactive map of 16 Istanbul filming locations from From Russia with Love, Taken 2, Skyfall, The Water Diviner, and Inferno.">
  <meta name="author"      content="Kübra Topçuoğlu">
  <meta name="keywords"    content="Istanbul, film locations, map, GPS coordinates, cinema tourism">

  <!-- Dublin Core -->
  <meta name="DC.title"     content="Map — Istanbul Cinema Tourism">
  <meta name="DC.creator"   content="Kübra Topçuoğlu">
  <meta name="DC.subject"   content="Istanbul filming locations; geographic dataset">
  <meta name="DC.publisher" content="University of Bologna — Digital Humanities and Digital Knowledge">
  <meta name="DC.date"      content="2026">
  <meta name="DC.language"  content="en">
  <meta name="DC.rights"    content="Editorial selection © 2026 Kübra Topçuoğlu — academic use">
  <meta name="DC.type"      content="Dataset">
  <meta name="DC.coverage"  content="Istanbul, Türkiye">

  <!-- Open Graph -->
  <meta property="og:title"       content="Map — Istanbul Cinema Tourism">
  <meta property="og:description" content="Interactive map of 16 Istanbul filming locations across five international films.">
  <meta property="og:type"        content="website">

  <!-- ─── SCHEMA.ORG JSON-LD (static Dataset descriptor) ─────────────────── -->
  <script type="application/ld+json">
  {
    "@context":      "https://schema.org",
    "@type":         "Dataset",
    "name":          "Istanbul Film Locations — LMML Dataset",
    "description":   "Curated dataset of 16 cinematic locations in Istanbul drawn from five international productions filmed between 1963 and 2016.",
    "keywords":      ["Istanbul", "film locations", "cinema tourism", "Digital Humanities", "LMML"],
    "creator":       { "@type": "Person", "name": "Kübra Topçuoğlu" },
    "license":       "Academic fair use — University of Bologna",
    "spatialCoverage": { "@type": "Place", "name": "Istanbul, Türkiye" },
    "temporalCoverage":"1963/2016",
    "inLanguage":    "en",
    "dateModified":  "2026-05-07",
    "isPartOf":      { "@type": "WebSite", "name": "Istanbul Cinema Tourism — LMML" },
    "variableMeasured": [
      "location coordinates", "film reference", "camera orientation",
      "narrative chapter", "text variants (brief/mid/long)"
    ]
  }
  </script>

  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet CSS (no SRI — file:// protocol blocks SRI checks) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- ── NAVIGATION ──────────────────────────────────────────────────────── -->
  <div class="main-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-brand" href="index.html" aria-label="Home">
      <span class="nav-brand-title">Istanbul</span>
      <span class="nav-brand-sub">Cinema Tourism</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <ul class="nav-links" id="navLinks" role="list">
      <li><a class="nav-link" href="index.html">Cover</a></li>
      <li><a class="nav-link active" href="map.html">Map</a></li>
      <li><a class="nav-link" href="explore.html">Explore</a></li>
      <li><a class="nav-link" href="about.html">About</a></li>
      <li><a class="nav-link" href="docs.html">Documentation</a></li>
      <li><a class="nav-link" href="disclaimer.html">Disclaimer</a></li>
    </ul>

    <div class="theme-switcher" role="group" aria-label="Select visual theme">
      <button class="theme-btn" data-theme-choice="cinematic" aria-label="Mid-Century Cinema theme" title="Mid-Century Cinema — Second half of XX Century print">◉</button>
      <button class="theme-btn" data-theme-choice="heritage"  aria-label="Heritage theme"           title="Heritage — XIX Century print">❦</button>
    </div>

  </div>

  <!-- ── MAP APP ────────────────────────────────────────────────────────── -->
  <div class="map-wrapper" role="main">

    <!-- Sidebar -->
    <div class="map-sidebar" role="complementary" aria-label="Location list and filters">

      <div class="map-sidebar-header">
        <h1 class="map-sidebar-title">Film Locations</h1>
        <p class="label" data-mb="sm">Filter by narrative</p>
        <div class="map-filter-pills" role="group" aria-label="Filter locations">
          <button class="map-filter-pill active-all" data-filter="all"        id="filterAll">All</button>
          <button class="map-filter-pill"             data-filter="pursuit"   id="filterEspionage">◈ Pursuit</button>
          <button class="map-filter-pill"             data-filter="timeline"  id="filterTimeline">◇ Timeline</button>
        </div>
      </div>

      <div class="map-location-list" id="mapLocationList" role="list" aria-label="Location list">
        <!-- Populated by JS -->
      </div>

      <div class="map-location-detail hidden" id="mapLocationDetail" role="region" aria-label="Location detail" aria-live="polite">
        <h2 class="map-detail-name" id="detailName"></h2>
        <div class="map-detail-film" id="detailFilm"></div>
        <p class="map-detail-desc"  id="detailDesc"></p>
        <div id="detailNarrativeTags" class="popup-narrative-tags"></div>
        <a href="explore.html" class="map-detail-link" id="detailExploreLink" data-mt="md">
          Explore this location →
        </a>
      </div>

      <!-- Previous / next page links inside the map sidebar -->
      <div class="map-sidebar-page-nav" aria-label="Page navigation">
        <a href="index.html"   class="btn btn-ghost">← Cover</a>
        <a href="explore.html" class="btn btn-ghost">Explore →</a>
      </div>

    </div>

    <!-- Map -->
    <div class="map-container" role="application" aria-label="Interactive map of Istanbul film locations">
      <div id="map"></div>
    </div>

  </div>

  <!-- Legend -->
  <div class="map-legend" aria-label="Map legend">
    <p class="label" data-mb="xs">Map Legend</p>
    <div class="map-legend-row">
      <div class="map-legend-dot" data-narr="pursuit"></div>
      <span class="map-legend-text">Pursuit & Passage</span>
    </div>
    <div class="map-legend-row">
      <div class="map-legend-dot" data-narr="timeline"></div>
      <span class="map-legend-text">Through Time</span>
    </div>
    <div class="map-legend-row">
      <div class="map-legend-dot" data-narr="both"></div>
      <span class="map-legend-text">Both Narratives</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      // ---- 1. Mobile nav toggle ----
      const navToggle = document.getElementById("navToggle");
      const navLinks  = document.getElementById("navLinks");
      navToggle.addEventListener("click", () => {
        const open = navLinks.classList.toggle("open");
        navToggle.setAttribute("aria-expanded", String(open));
      });

      // ---- 2. Theme switcher buttons ----
      function syncThemeButtons() {
        const active = App.getTheme();
        document.querySelectorAll(".theme-btn").forEach(btn => {
          const isActive = btn.dataset.themeChoice === active;
          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-pressed", String(isActive));
        });
      }
      document.querySelectorAll(".theme-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          App.setTheme(btn.dataset.themeChoice);
          syncThemeButtons();
        });
      });
      syncThemeButtons();

    });
  </script>

</body>
</html>
