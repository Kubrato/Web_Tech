<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map — Istanbul Cinema Tourism</title>

  <!-- ─── STANDARD METADATA ────────────────────────────────────────── -->
  <meta name="description" content="Interactive map of 16 Istanbul filming locations from From Russia with Love, Taken 2, Skyfall, The Water Diviner, and Inferno.">
  <meta name="author"      content="Kübra Topçuoğlu">
  <meta name="keywords"    content="Istanbul, film locations, map, GPS coordinates, cinema tourism">

  <!-- Dublin Core (a metadata standard from library science) -->
  <meta name="DC.title"     content="Map — Istanbul Cinema Tourism">
  <meta name="DC.creator"   content="Kübra Topçuoğlu">
  <meta name="DC.subject"   content="Istanbul filming locations; geographic dataset">
  <meta name="DC.publisher" content="University of Bologna — Digital Humanities and Digital Knowledge">
  <meta name="DC.date"      content="2026">
  <meta name="DC.language"  content="en">
  <meta name="DC.rights"    content="Editorial selection © 2026 Kübra Topçuoğlu — academic use">
  <meta name="DC.type"      content="Dataset">
  <meta name="DC.coverage"  content="Istanbul, Türkiye">

  <!-- Open Graph (for social media sharing) -->
  <meta property="og:title"       content="Map — Istanbul Cinema Tourism">
  <meta property="og:description" content="Interactive map of 16 Istanbul filming locations across five international films.">
  <meta property="og:type"        content="website">

  <!-- ─── SCHEMA.ORG JSON-LD (structured data of type Dataset) ────────── -->
  <script type="application/ld+json">
  {
    "@context":      "https://schema.org",
    "@type":         "Dataset",
    "name":          "Istanbul Film Locations — LMML Dataset",
    "description":   "Curated dataset of 16 cinematic locations in Istanbul drawn from five international productions filmed between 1963 and 2016.",
    "keywords":      ["Istanbul", "film locations", "cinema tourism", "Digital Humanities", "LMML"],
    "creator":       { "@type": "Person", "name": "Kübra Topçuoğlu" },
    "license":       "Academic fair use — University of Bologna",
    "spatialCoverage": { "@type": "Place", "name": "Istanbul, Türkiye" },
    "temporalCoverage":"1963/2016",
    "inLanguage":    "en",
    "dateModified":  "2026-05-07",
    "isPartOf":      { "@type": "WebSite", "name": "Istanbul Cinema Tourism — LMML" },
    "variableMeasured": [
      "location coordinates", "film reference", "camera orientation",
      "narrative chapter", "text variants (brief/mid/long)"
    ]
  }
  </script>

  <link rel="stylesheet" href="css/style.css">

  <!-- Leaflet CSS (no SRI — the file:// protocol blocks SRI checks) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

  <!-- ── NAVIGATION ──────────────────────────────────────────────────── -->
  <div class="main-nav" role="navigation">

    <a class="nav-brand" href="index.html">
      <span class="nav-brand-title">Istanbul</span>
      <span class="nav-brand-sub">Cinema Tourism</span>
    </a>

    <button class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>
    </button>

    <ul class="nav-links" id="navLinks" role="list">
      <li><a class="nav-link" href="index.html">Cover</a></li>
      <li><a class="nav-link active" href="map.html">Map</a></li>
      <li><a class="nav-link" href="explore.html">Explore</a></li>
      <li><a class="nav-link" href="about.html">About</a></li>
      <li><a class="nav-link" href="docs.html">Documentation</a></li>
      <li><a class="nav-link" href="disclaimer.html">Disclaimer</a></li>
    </ul>

    <div class="theme-switcher" role="group">
      <button class="theme-btn" data-theme-choice="cinematic" title="Mid-Century Cinema — Second half of XX Century print">◉</button>
      <button class="theme-btn" data-theme-choice="heritage"           title="Heritage — XIX Century print">❦</button>
    </div>

  </div>


  <!-- ── MAP APP ────────────────────────────────────────────────────── -->
  <div class="map-wrapper" role="main">

    <!-- Sidebar -->
    <div class="map-sidebar" role="complementary">

      <div class="map-sidebar-header">
        <h1 class="map-sidebar-title">Film Locations</h1>
        <p class="map-sidebar-hint">Click a marker or list item.</p>
      </div>

      <div class="map-location-list" id="mapLocationList" role="list">
        <!-- rows injected by map.js -->
      </div>

      <div class="map-location-detail hidden" id="mapLocationDetail" role="region">

        <h2 class="map-detail-name" id="detailName"></h2>
        <div class="map-detail-film" id="detailFilm"></div>
        <div id="detailNarrativeTags" class="popup-narrative-tags"></div>

        <a href="explore.html" class="map-detail-link" id="detailExploreLink" data-mt="md">
          Explore this location →
        </a>
      </div>


      <!-- Previous / next page links -->
      <div class="map-sidebar-page-nav">
        <a href="index.html"   class="btn btn-ghost">← Cover</a>
        <a href="explore.html" class="btn btn-ghost">Explore →</a>
      </div>

    </div>


    <!-- Map -->
    <div class="map-container" role="application">
      <div id="map"></div>
    </div>

  </div>


  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>


  <script>
    document.addEventListener("DOMContentLoaded", function() {

      // ----- mobile nav toggle button -----
      var navToggle = document.getElementById("navToggle");
      // Reference to the hamburger button.
      var navLinks  = document.getElementById("navLinks");
      // Reference to the menu list.

      navToggle.addEventListener("click", function() {
      // Click event.
        navLinks.classList.toggle("open");
        // Add or remove the "open" class.
      });

      // ----- theme switcher buttons -----
      function syncThemeButtons() {
      // Helper function that marks the active theme button visually.
        var active = App.getTheme();
        // Read the current theme name.
        var btns = document.querySelectorAll(".theme-btn");
        // Select all theme buttons.
        for (var i = 0; i < btns.length; i++) {
          if (btns[i].getAttribute("data-theme-choice") === active) {
            btns[i].classList.add("active");
            // Add the "active" class to the active button.
            // Tell assistive tech the toggle is pressed.
          } else {
            btns[i].classList.remove("active");
            // Other buttons are not pressed.
          }
        }
      }
      var themeBtns = document.querySelectorAll(".theme-btn");
      for (var t = 0; t < themeBtns.length; t++) {
        themeBtns[t].addEventListener("click", function() {
        // Click event for every theme button.
          App.setTheme(this.getAttribute("data-theme-choice"));
          // Apply the theme from the clicked button (it is saved in localStorage).
          syncThemeButtons();
          // Update the visual state.
        });
      }
      syncThemeButtons();
      // Sync once at the start so the active button is correct.

    });
  </script>

</body>
</html>
